[metadata]
name = ashley
version = 1.3.1
description = A self-hosted discussion forum for learning
long_description = file:README.md
long_description_content_type = text/markdown
author = Open FUN (France Universite Numerique)
author_email = fun.dev@fun-mooc.fr
url = https://github.com/openfun/ashley
license = MIT
keywords = Django, forum, Open edX, message board, discussion
classifiers =
    Development Status :: 4 - Beta
    Framework :: Django
    Framework :: Django :: 1.11
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8

[options]
include_package_data = True
install_requires =
    boto3==1.43.89
    Django>=6.1.1,<7 # pyup: >=3.2.4,<4
    django-storages==1.14.6
    django-haystack==3.4.0
    django-lti-toolbox==2.0.0
    django-machina==1.3.1
    draftjs_exporter==7.1.0
    djangorestframework==3.18.0
    elasticsearch>=5.0.0,<6.0.0 # pyup: >=5.0.0,<6.0.0
    logging-ldp==0.0.7
    oauthlib>=3.0.0
    tincan==1.0.0
package_dir =
    =src
packages = find:
zip_safe = True

[options.extras_require]
dev =
    bandit==1.9.4
    black==26.5.1
    flake8==7.3.0
    ipdb==0.13.13
    ipython==9.17.1
    isort==9.0.1
    mypy==2.3.1
    pyfakefs==6.2.0
    pylint-django==2.8.0
    pylint==4.0.8
    pytest-cov==7.1.0
    pytest-django==4.14.0
    pytest==9.1.1
    lxml==6.1.3
    cssselect==1.1.0

ci =
    twine==7.0.0
sandbox =
    django-configurations==2.5.1
    dockerflow==2026.3.4
    factory_boy==3.3.3
    gunicorn==26.2.0
    psycopg2-binary==2.9.12
    sentry-sdk==2.68.1

[options.packages.find]
where = src

[wheel]
universal = 1

;;
;; Third-party packages configuration
;;
[flake8]
max-line-length = 99
exclude =
    .git,
    .venv,
    build,
    venv,
    __pycache__,
    node_modules,
    */migrations/*

[isort]
known_ashley=ashley,sandbox
include_trailing_comma=True
line_length=88
multi_line_output=3
use_parentheses=True
sections=FUTURE,STDLIB,THIRDPARTY,ASHLEY,FIRSTPARTY,LOCALFOLDER
skip_glob=src/frontend/node_modules/**/*,venv

[tool:pytest]
addopts = -v --cov-report term-missing
python_files =
    test_*.py
    tests.py
testpaths =
    tests

[mypy]
ignore_missing_imports = True
exclude = src/ashley/static/

[mypy-*.migrations.*]
# Django migrations should not be type checked
ignore_errors = True
